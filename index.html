<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسرار فورت نايت | FN_Secrets</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* غلاف الحساب */
        .banner {
            width: 100%;
            max-width: 900px;
            height: 250px;
            background: linear-gradient(135deg, #1f2833, #0b0c10);
            border: 2px solid #45a29e;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(69, 162, 158, 0.3);
            position: relative;
            margin-bottom: 50px;
        }

        .banner h1 {
            color: #66fcf1;
            font-size: 2.5rem;
            text-shadow: 0 0 10px #66fcf1;
        }

        /* صورة البروفايل */
        .profile-avatar {
            width: 120px;
            height: 120px;
            background: #1f2833;
            border: 4px solid #66fcf1;
            border-radius: 50%;
            position: absolute;
            bottom: -40px;
            right: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            box-shadow: 0 0 15px #66fcf1;
        }

        /* معلومات الهوية */
        .bio-card {
            width: 100%;
            max-width: 900px;
            background: #1f2833;
            padding: 25px;
            border-radius: 12px;
            border-right: 5px solid #66fcf1;
            margin-bottom: 30px;
        }

        .bio-card h2 {
            color: #66fcf1;
            margin-bottom: 10px;
        }

        .bio-card p {
            color: #c5c6c7;
            line-height: 1.6;
        }

        /* قالب المعاينة */
        .preview-box {
            width: 100%;
            max-width: 500px;
            height: 500px;
            border: 2px dashed #45a29e;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(31, 40, 51, 0.5);
            position: relative;
        }

        .preview-header {
            background: #45a29e;
            color: #0b0c10;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
        }

        .watermark {
            align-self: flex-start;
            color: rgba(102, 252, 241, 0.5);
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- غلاف الحساب -->
    <div class="banner">
        <h1>رصد وتغطية التحديثات</h1>
        <div class="profile-avatar">❓</div>
    </div>

    <!-- النبذة والهوية -->
    <div class="bio-card">
        <h2>FN_Secrets | أسرار فورت نايت</h2>
        <p>🔓 بوابتك الأولى لكل جديد في فورت نايت.<br>تسريبات، ملفات التحديثات، وكل ما هو مخفي أول بأول ⚡</p>
    </div>

    <!-- قالب المعاينة للنشر -->
    <div class="preview-box">
        <div class="preview-header">جديد! [اسم السكن]</div>
        <p style="color: #45a29e;">[ضع صورة السكن المستخرجة من FModel هنا]</p>
        <div class="watermark">@FN_Secrets</div>
    </div>

</body>
</html>
